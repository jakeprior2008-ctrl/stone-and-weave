# Tag rules: text (title + description + slug) -> tags.
# Vocabulary derived from the real catalogues of Doble Vintage Watches,
# Goldammer, Analog Shift and Craft & Tailored. Edit freely - no code change needed.
#
# Each rule:
#   tag:      canonical tag id (kebab-case)
#   label:    display name in the UI
#   group:    filter-rail grouping
#   any:      list of regex fragments; a match on any one applies the tag
#   rarity:   0-10, feeds the oddity score. 10 = drop everything and look.
#   synonyms: optional list of plain lower-case words/phrases (NOT regex) a
#             person might type for this tag. Used only by the site's query
#             parser to resolve natural-language search into tag filters -
#             it never touches tagging itself, and does not need to mirror
#             the `any` patterns above.
#
# `phrases:` (top level, below) maps a multi-word natural phrase to a list of
# existing tag ids, for concepts that span more than one tag (e.g. "green
# stone" -> several stone dial tags). Same rule: query parser only, never
# tagging.

# Grail tags: an outright drop-everything hit. Scored above ordinary rarity and
# badged in the UI. Jake's standing order: feather and coral dials are the best
# there is, stone dials and odd weaves right behind.
grails: [feather-dial, coral, malachite, lapis-lazuli, tigers-eye, rhodochrosite,
         jasper, tortoise-shell, tiger-iron, chrysocolla, pietersite, amazonite,
         rhodonite, unakite, petrified-wood, cloisonne, mystery-dial, lacquer,
         prototype, birds-eye]

# Families: tags describing one physical feature. Only the rarest tag in a
# family scores, so a lapis dial is not paid twice for also being a stone dial,
# and a bark-finish case is not paid three times for bark + hammered + textured.
families:
  stone: [stone-dial, malachite, lapis-lazuli, tigers-eye, onyx, jade, opal, coral,
          turquoise, rhodochrosite, sodalite, bloodstone, obsidian, agate, jasper,
          aventurine, meteorite, tortoise-shell, tiger-iron, chrysocolla,
          pietersite, amazonite, rhodonite, unakite, petrified-wood]
  texture: [textured-dial, hammered-bracelet, bark-bracelet, bark-finish]

groups:
  dial: Dial
  bracelet: Bracelet & strap
  case: Case & shape
  character: Character

# Multi-tag natural-language phrases -> list of existing tag ids. Query
# parser only; every tag named here must exist as a rule below.
phrases:
  green stone: [malachite, jade, chrysocolla, aventurine, amazonite, bloodstone]
  blue stone: [lapis-lazuli, sodalite, turquoise]
  black stone: [onyx, obsidian]
  red stone: [coral, jasper, rhodochrosite]
  pink stone: [rhodochrosite, rhodonite, coral]
  brown stone: [tigers-eye, tiger-iron, petrified-wood, pietersite]
  white stone: [mother-of-pearl, opal]
  stone: [stone-dial]
  woven: [woven-bracelet, bamboo-bracelet, rope-bracelet, corn-bracelet, claw-bracelet,
          brick-bracelet, bark-bracelet, ladder-bracelet, beads-of-rice, tubogas]
  weave: [woven-bracelet, bamboo-bracelet, rope-bracelet, corn-bracelet, claw-bracelet,
          brick-bracelet, bark-bracelet, ladder-bracelet, beads-of-rice, tubogas]
  mesh: [woven-bracelet, bamboo-bracelet, rope-bracelet, corn-bracelet, claw-bracelet,
         brick-bracelet, bark-bracelet, ladder-bracelet, beads-of-rice, tubogas]
  shaped case: [tonneau, tv-case, cushion, octagon, hexagon, oval-case, asymmetric, ellipse]
  shaped: [tonneau, tv-case, cushion, octagon, hexagon, oval-case, asymmetric, ellipse]
  odd shape: [tonneau, tv-case, cushion, octagon, hexagon, oval-case, asymmetric, ellipse]
  textured: [textured-dial, hammered-bracelet, bark-bracelet, bark-finish]
  complication: [jump-hour, mystery-dial, world-time, alarm, moonphase]
  odd bracelet: [woven-bracelet, bamboo-bracelet, rope-bracelet, corn-bracelet, claw-bracelet,
                 brick-bracelet, bark-bracelet, ladder-bracelet, beads-of-rice, tubogas]
  scenic dial: [cloisonne, feather-dial, birds-eye, lacquer]
  rare stone: [rhodochrosite, jasper, tiger-iron, chrysocolla, pietersite, amazonite,
               rhodonite, unakite, petrified-wood]

