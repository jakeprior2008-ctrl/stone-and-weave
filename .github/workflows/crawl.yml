name: Crawl

on:
  schedule:
    # Every 6 hours. Public repo, so Actions minutes are free.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Crawl a single dealer id only (blank = all)'
        required: false

# Never let two crawls write data/ at once.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A taxonomy regression would poison the dataset, so gate the crawl on tests.
      - run: pnpm test

      - name: Crawl
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            pnpm crawl -- --source "${{ inputs.source }}"
          else
            pnpm crawl
          fi

      - name: Commit data
        run: |
          git config user.name  "stone-and-weave[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No listing changes."
            exit 0
          fi
          active=$(node -p "require('./data/listings.json').length")
          git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ) — ${active} active listings"

          # Another push may have landed while we were fetching. The data files
          # are generated, so a "conflict" is not a real one - this crawl is
          # strictly newer than whatever it is rebasing onto, and its output
          # should win outright. Rebasing tries to merge them line by line and
          # leaves the tree unmerged, which is how the 16:20 run died. Instead,
          # rewind onto the remote tip while keeping our files, and recommit.
          for i in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/
            git diff --staged --quiet && exit 0
            git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ) — ${active} active listings"
            sleep $((2 ** i))
          done
          exit 1
