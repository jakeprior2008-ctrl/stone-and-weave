# The places we deliberately do NOT scrape - anti-bot, no API, or terms that
# don't allow it. Surfaced in the app's Hunt tab as one-click link-outs instead.

instagram:
  - { handle: doblevintagewatches, name: Doble Vintage Watches, note: "The gold standard. Stone dials, bamboo, cobra, feather." }
  - { handle: dadandson.watches, name: Dad & Son, note: "Hong Kong. Gallery site with no online store - Instagram is the shop." }
  - { handle: cyclopewatches, name: Cyclope, note: "Paris. Rare vintage, no open feed - IG is the shop." }
  - { handle: wristandwatchco, name: Wrist and Watch Co, note: "Rare collector pieces." }
  - { handle: goldammervintage, name: Goldammer, note: "Also crawled - IG gets the drops first." }
  - { handle: analogshift, name: Analog Shift }
  - { handle: craftandtailored, name: Craft & Tailored }
  - { handle: anordain, name: anOrdain, note: "Grand feu enamel." }
  - { handle: theo_and_harris, name: Theo & Harris }
  - { handle: vintage_watches_milano, name: Vintage Watches Milano }
  - { handle: c4c_vintage_watches, name: C4C Vintage Watches }

auctions:
  - { name: Grey Market, url: "https://grymrkt.co/", note: "Vintage & neo-vintage auctions. No feed - check manually." }
  - { name: Grays Antiques, url: "https://www.graysantiques.com/jewellery/watches-timepieces", note: "Mayfair, 100 dealers. Physical-first." }

